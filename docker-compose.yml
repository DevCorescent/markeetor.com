# Local development stack. `docker compose up -d` starts Postgres + Redis (+ optional app/worker).
# The app connects as the non-superuser `leads_app` role so row-level security is enforced.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-only}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-dev-only}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://leads_app:${APP_DB_PASSWORD:-change-me-dev-only}@postgres:5432/leads_crm?schema=public
      REDIS_URL: redis://redis:6379/0
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    volumes: [storage:/app/storage]

  worker:
    profiles: ["app"]
    build: .
    command: ["npm", "run", "worker:prod"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://leads_app:${APP_DB_PASSWORD:-change-me-dev-only}@postgres:5432/leads_crm?schema=public
      REDIS_URL: redis://redis:6379/0
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    volumes: [storage:/app/storage]

volumes:
  pgdata:
  redisdata:
  storage:
