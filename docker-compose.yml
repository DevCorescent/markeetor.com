# Local development stack. `docker compose up -d` starts Postgres (+ optional app/worker).
# The job queue lives in Postgres, so there is no broker to run.
# The app connects as the non-superuser `leads_app` role so row-level security is enforced.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-only}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-dev-only}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://leads_app:${APP_DB_PASSWORD:-change-me-dev-only}@postgres:5432/leads_crm?schema=public
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy } }
    volumes: [storage:/app/storage]

  worker:
    profiles: ["app"]
    build: .
    command: ["npm", "run", "worker:prod"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://leads_app:${APP_DB_PASSWORD:-change-me-dev-only}@postgres:5432/leads_crm?schema=public
    depends_on: { postgres: { condition: service_healthy } }
    volumes: [storage:/app/storage]

volumes:
  pgdata:
  storage:
