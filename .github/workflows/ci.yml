name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://leads_app:ci_password@localhost:5432/leads_crm_test?schema=public
      TEST_DATABASE_URL: postgresql://leads_app:ci_password@localhost:5432/leads_crm_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SESSION_SECRET: ci-session-secret-not-used-in-production-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Create non-superuser app role (RLS must apply)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE leads_app LOGIN PASSWORD 'ci_password' CREATEDB NOSUPERUSER NOBYPASSRLS;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE leads_crm_test OWNER leads_app;"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
