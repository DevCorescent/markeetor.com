# nginx site for markeetor.com — reverse proxy in front of `next start` on 127.0.0.1:3000.
#
# Install:
#   sudo cp deploy/nginx/markeetor.com.conf /etc/nginx/sites-available/markeetor.com
#   sudo ln -s /etc/nginx/sites-available/markeetor.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file in place to add the TLS listener:
#   sudo certbot --nginx -d markeetor.com -d www.markeetor.com

upstream markeetor_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name markeetor.com www.markeetor.com;

    # Certbot writes its challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://markeetor_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # IMPORTANT: $remote_addr, NOT $proxy_add_x_forwarded_for.
        # The app runs with TRUST_PROXY=true and therefore trusts the LEFT-most hop of this
        # header as the client IP. $proxy_add_x_forwarded_for appends to whatever the client
        # sent, so a request with a forged X-Forwarded-For would let an attacker pick their
        # own IP and walk around the per-IP rate limits and IP allowlists. Overwriting the
        # header here is what makes TRUST_PROXY=true safe.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # CSV/XLSX lead imports and attachments go up to MAX_UPLOAD_MB (default 25).
        # nginx defaults to 1m, which would reject them with a 413.
        client_max_body_size 30m;

        # Long-running work: imports, exports and AI research can exceed the 60s default.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Immutable build assets — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://markeetor_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app sets its own CSP, HSTS and frame headers (see next.config.ts); nginx must not
    # duplicate or weaken them. Only hide the upstream server banner here.
    server_tokens off;

    access_log /var/log/nginx/markeetor.access.log;
    error_log  /var/log/nginx/markeetor.error.log;
}
